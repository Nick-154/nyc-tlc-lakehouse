[project]
name = "nyc-tlc-lakehouse"
version = "0.1.0"
description = "Incremental NYC taxi lakehouse: Airflow orchestration, DuckDB warehouse, quality gates, Type 2 dimensions"
requires-python = ">=3.10,<3.13"
dependencies = [
    "apache-airflow==3.3.1",
    "duckdb>=1.5",
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
